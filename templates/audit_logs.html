<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // SECURITY AUDIT v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-blue: #00d9ff;
            --neon-red: #ff3e3e;
            --neon-yellow: #ffcc00;
            --bg-deep: #050505;
            --bg-surface: #0f0f0f;
            --border-glow: rgba(0, 255, 136, 0.15);
        }

        body {
            background-color: var(--bg-deep);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Scanning Line Effect */
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 136, 0.05);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        /* Glass Cards */
        .glass-panel {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        /* Neon Accents */
        .text-neon-green { color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 136, 0.4); }
        .text-neon-red { color: var(--neon-red); text-shadow: 0 0 8px rgba(255, 62, 62, 0.4); }
        .text-neon-blue { color: var(--neon-blue); text-shadow: 0 0 8px rgba(0, 217, 255, 0.4); }

        /* Tab Transitions */
        .tab-btn {
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active { color: var(--neon-green); }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }

        /* Pulse Animation */
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-elite {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.2s;
            position: relative;
        }
        .btn-elite:hover:not(:disabled) {
            background: white;
            color: black;
            box-shadow: 0 0 15px white;
        }

        .data-bar {
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            width: 100px;
        }
        .data-bar-fill {
            height: 100%;
            background: var(--neon-green);
            width: 0%;
            transition: width 1s ease-out;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="scanline"></div>

    <div class="max-w-[1600px] mx-auto space-y-6">
        
        <!-- TOP NAVIGATION & STATUS -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 pb-6 border-b border-white/5">
            <div class="space-y-1">
                <div class="flex items-center gap-3 text-[10px] mono tracking-[0.2em] uppercase text-white/40">
                    <span class="flex items-center gap-2 text-neon-green">
                        <span class="w-1.5 h-1.5 rounded-full bg-neon-green pulse"></span>
                        Secure Link Established
                    </span>
                    <span class="w-px h-3 bg-white/10"></span>
                    <span>Region: US-EAST-1</span>
                    <span class="w-px h-3 bg-white/10"></span>
                    <span id="liveClock" class="text-white/60">00:00:00</span>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tighter italic uppercase">SECURITY <span class="text-neon-green">AUDIT</span> TERMINAL</h1>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="refreshAll()" id="syncBtn" class="btn-elite px-6 py-2.5 rounded text-xs font-bold mono uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Synchronize
                </button>
                <a href="/super-admin/dashboard" class="bg-white text-black hover:bg-neon-green hover:shadow-[0_0_20px_rgba(0,255,136,0.5)] transition-all px-6 py-2.5 rounded text-xs font-bold mono uppercase tracking-wider">
                    Dashboard
                </a>
            </div>
        </header>

        <!-- ANALYTICS PREVIEW -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass-panel p-4 rounded-lg space-y-2 border-l-2 border-l-neon-green">
                <div class="text-[10px] mono text-white/40 uppercase">System Integrity</div>
                <div class="text-2xl font-bold mono">99.98%</div>
                <div class="data-bar"><div class="data-bar-fill" style="width: 99.9%;"></div></div>
            </div>
            <div class="glass-panel p-4 rounded-lg space-y-2 border-l-2 border-l-neon-blue">
                <div class="text-[10px] mono text-white/40 uppercase">Data Throughput</div>
                <div class="text-2xl font-bold mono" id="throughputValue">0.0 MB/s</div>
                <div class="data-bar"><div class="data-bar-fill" id="throughputBar" style="width: 20%; background: var(--neon-blue);"></div></div>
            </div>
            <div class="glass-panel p-4 rounded-lg space-y-2 border-l-2 border-l-neon-yellow">
                <div class="text-[10px] mono text-white/40 uppercase">Threat Level</div>
                <div class="text-2xl font-bold mono">STABLE</div>
                <div class="data-bar"><div class="data-bar-fill" style="width: 10%; background: var(--neon-yellow);"></div></div>
            </div>
            <div class="glass-panel p-4 rounded-lg space-y-2 border-l-2 border-l-neon-red">
                <div class="text-[10px] mono text-white/40 uppercase">Critical Alerts</div>
                <div id="alertCount" class="text-2xl font-bold mono">0</div>
                <div class="data-bar"><div id="alertBar" class="data-bar-fill" style="width: 0%; background: var(--neon-red);"></div></div>
            </div>
        </div>

        <!-- CRITICAL ALERTS BOX -->
        <div id="lockedAlert" class="hidden">
            <div class="bg-neon-red/10 border border-neon-red/30 p-6 rounded-lg">
                <div class="flex items-center gap-3 mb-4 text-neon-red font-bold mono text-sm uppercase tracking-widest">
                    <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    Critical: Locked Accounts Detected
                </div>
                <div id="lockedList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </div>

        <!-- MAIN INTERFACE -->
        <div class="glass-panel rounded-xl overflow-hidden border border-white/5">
            <div class="flex items-center justify-between border-b border-white/5 bg-white/[0.02] px-6">
                <div class="flex gap-8">
                    <button onclick="switchTab('logs')" id="tab-logs" class="tab-btn active py-4 text-xs font-bold mono uppercase tracking-widest">Audit Logs</button>
                    <button onclick="switchTab('security')" id="tab-security" class="tab-btn py-4 text-xs font-bold mono uppercase tracking-widest">Security Events</button>
                </div>
            </div>

            <div class="p-6">
                <!-- Filters -->
                <div class="flex flex-wrap gap-4 mb-6">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-[10px] mono text-white/30 uppercase mb-1.5">Action Filter</label>
                        <select id="actionFilter" onchange="loadLogs()" class="w-full bg-white/[0.03] border border-white/10 rounded p-2.5 text-xs mono text-white focus:outline-none">
                            <option value="">All Streams</option>
                            <option value="event_created">Event Genesis</option>
                            <option value="event_deleted">Event Termination</option>
                            <option value="admin_created">Admin Elevation</option>
                            <option value="account_locked">Account Locked</option>
                            <option value="account_unlocked">Account Unlocked</option>
                        </select>
                    </div>
                    <div class="w-48">
                        <label class="block text-[10px] mono text-white/30 uppercase mb-1.5">Date Range</label>
                        <input type="date" id="dateFilter" onchange="loadLogs()" class="w-full bg-white/[0.03] border border-white/10 rounded p-2.5 text-xs mono text-white focus:outline-none">
                    </div>
                </div>

                <div class="overflow-x-auto min-h-[400px]">
                    <div id="tableContainer">
                        <div class="py-20 flex flex-col items-center justify-center opacity-40">
                            <div class="w-10 h-10 border-2 border-t-neon-green border-white/10 rounded-full animate-spin mb-4"></div>
                            <div class="mono text-[10px] uppercase tracking-[0.3em]">Querying Database...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TERMINAL LOG -->
        <div class="glass-panel p-4 rounded-lg mono text-[10px] h-32 overflow-y-auto bg-black/80 border-t-2 border-t-neon-green/20">
            <div id="terminalStream" class="space-y-1">
                <div class="text-white/30">> system.init() initialized</div>
                <div class="text-neon-green">> connection secure</div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'logs';

        function updateClock() {
            document.getElementById('liveClock').textContent = new Date().toLocaleTimeString('en-GB', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function addTerminalMsg(msg, color = 'text-white/30') {
            const stream = document.getElementById('terminalStream');
            const div = document.createElement('div');
            div.className = color;
            div.textContent = `> [${new Date().toLocaleTimeString()}] ${msg}`;
            stream.prepend(div);
            if (stream.children.length > 50) stream.lastChild.remove();
        }

        function parseTS(ts) {
            if (!ts) return new Date();
            const val = ts.$date ? (ts.$date.$numberLong ? parseInt(ts.$date.$numberLong) : ts.$date) : ts;
            return new Date(val);
        }

        function getTagStyle(type) {
            const map = {
                'event_created': 'text-neon-green bg-neon-green/10 border-neon-green/30',
                'account_locked': 'text-neon-red bg-neon-red/10 border-neon-red/30',
                'login_failed': 'text-neon-yellow bg-neon-yellow/10 border-neon-yellow/30',
                'admin_elevation': 'text-neon-blue bg-neon-blue/10 border-neon-blue/30',
                'account_unlocked': 'text-neon-green bg-neon-green/10 border-neon-green/30'
            };
            return map[type] || 'text-white/40 bg-white/5 border-white/10';
        }

        function extractId(obj) {
            // Handle different MongoDB ID formats from json_util
            if (!obj) return null;
            if (typeof obj === 'string') return obj;
            if (obj.$oid) return obj.$oid;
            if (obj._id) return extractId(obj._id);
            return null;
        }

        async function loadLockedAccounts() {
            try {
                const res = await fetch('/super-admin/api/locked-accounts');
                const data = await res.json();
                const alertBox = document.getElementById('lockedAlert');
                const list = document.getElementById('lockedList');
                const countEl = document.getElementById('alertCount');
                const barEl = document.getElementById('alertBar');

                if (data.success && data.locked_accounts?.length > 0) {
                    alertBox.classList.remove('hidden');
                    countEl.textContent = data.locked_accounts.length;
                    barEl.style.width = '100%';
                    
                    list.innerHTML = data.locked_accounts.map(acc => {
                        const userId = extractId(acc._id);
                        const blockUntil = parseTS(acc.login_block_until);
                        const remaining = Math.max(0, Math.ceil((blockUntil - new Date()) / 60000));
                        return `
                            <div class="glass-panel p-4 rounded border-white/10 bg-black/40 flex justify-between items-center group">
                                <div class="space-y-1">
                                    <div class="text-xs font-bold mono text-white">${acc.name}</div>
                                    <div class="text-[10px] mono text-white/40">${acc.email}</div>
                                    <div class="text-[9px] text-neon-red mono font-bold uppercase">Locked: ${remaining}m remaining</div>
                                </div>
                                <button onclick="unlockAccount('${userId}')" class="bg-neon-red/20 hover:bg-neon-red text-neon-red hover:text-white border border-neon-red/30 px-3 py-1.5 rounded text-[10px] mono font-bold transition-all uppercase">
                                    Unlock
                                </button>
                            </div>
                        `;
                    }).join('');
                } else {
                    alertBox.classList.add('hidden');
                    countEl.textContent = "0";
                    barEl.style.width = '0%';
                }
            } catch (e) {
                console.error('Error loading locked accounts:', e);
                addTerminalMsg('Failed to poll locked accounts', 'text-neon-red');
            }
        }

        async function loadLogs() {
            const action = document.getElementById('actionFilter').value;
            const date = document.getElementById('dateFilter').value;
            const container = document.getElementById('tableContainer');
            
            const typeParam = currentTab === 'security' ? 'account_locked,account_unlocked,login_failed' : action;

            try {
                const res = await fetch(`/super-admin/api/audit-logs?action_type=${typeParam}&date=${date}`);
                const data = await res.json();

                if (data.success && data.logs?.length > 0) {
                    let html = `
                        <table class="w-full text-left border-separate border-spacing-y-2">
                            <thead>
                                <tr class="text-[10px] mono text-white/30 uppercase tracking-widest">
                                    <th class="px-4 py-2">Timestamp</th>
                                    <th class="px-4 py-2">Action Type</th>
                                    <th class="px-4 py-2">Initiator</th>
                                    <th class="px-4 py-2">Target</th>
                                    <th class="px-4 py-2 text-right">Activity Trace</th>
                                </tr>
                            </thead>
                            <tbody class="mono text-xs">
                    `;

                    data.logs.forEach(l => {
                        const d = parseTS(l.timestamp);
                        html += `
                            <tr class="group hover:bg-white/[0.02] transition-colors">
                                <td class="px-4 py-3 border-y border-l border-white/5 rounded-l-lg text-white/60">
                                    <div class="font-bold text-white">${d.toLocaleDateString()}</div>
                                    <div class="text-[10px] opacity-50">${d.toLocaleTimeString()}</div>
                                </td>
                                <td class="px-4 py-3 border-y border-white/5">
                                    <span class="px-2 py-0.5 rounded border text-[9px] font-bold uppercase ${getTagStyle(l.action_type)}">
                                        ${l.action_type.replace(/_/g, ' ')}
                                    </span>
                                </td>
                                <td class="px-4 py-3 border-y border-white/5">
                                    <div class="font-bold text-white/90">${l.performed_by_name || 'System'}</div>
                                    <div class="text-[10px] text-white/30">${l.performed_by_email || ''}</div>
                                </td>
                                <td class="px-4 py-3 border-y border-white/5 text-neon-blue">
                                    ${l.target_user_name || 'Global'}
                                </td>
                                <td class="px-4 py-3 border-y border-r border-white/5 rounded-r-lg text-right text-white/40 max-w-[300px] truncate">
                                    ${l.details || '—'}
                                </td>
                            </tr>
                        `;
                    });
                    container.innerHTML = html + `</tbody></table>`;
                    addTerminalMsg(`Rendered ${data.logs.length} records`);
                } else {
                    container.innerHTML = `<div class="py-20 text-center mono text-white/30 uppercase text-[10px] tracking-widest">Zero Data Matches Found</div>`;
                }
            } catch (e) {
                console.error('Error loading logs:', e);
                container.innerHTML = `<div class="py-20 text-center text-neon-red mono text-[10px] uppercase">Connection Interrupted</div>`;
            }
        }

        async function unlockAccount(userId) {
            if (!userId) {
                addTerminalMsg('Error: Invalid user ID', 'text-neon-red');
                return;
            }
            
            addTerminalMsg(`Manual unlock signal sent for UID: ${userId}`, 'text-neon-yellow');
            try {
                const res = await fetch(`/super-admin/api/unlock-account/${userId}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    addTerminalMsg(`Account ${userId} unlocked successfully`, 'text-neon-green');
                    refreshAll();
                } else {
                    addTerminalMsg(`Unlock rejected: ${data.message}`, 'text-neon-red');
                }
            } catch (e) {
                console.error('Unlock error:', e);
                addTerminalMsg('Network error during unlock request', 'text-neon-red');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            addTerminalMsg(`Switched context to ${tab.toUpperCase()}`);
            loadLogs();
        }

        function refreshAll() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin">◌</span> Syncing`;
            
            Promise.all([loadLockedAccounts(), loadLogs()]).then(() => {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Synchronize`;
                addTerminalMsg('Environment synchronized', 'text-neon-green');
                
                // Randomize throughput for aesthetic effect
                const val = (Math.random() * 2).toFixed(1);
                document.getElementById('throughputValue').textContent = `${val} MB/s`;
                document.getElementById('throughputBar').style.width = `${Math.min(100, val * 40)}%`;
            });
        }

        window.onload = refreshAll;
        setInterval(loadLockedAccounts, 30000);
    </script>
</body>
</html>
