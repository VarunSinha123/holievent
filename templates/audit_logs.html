<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Audit Command | EventPass Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .elite-table th {
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: #64748b;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px currentColor;
        }

        .mono-time {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .live-indicator { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .refresh-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-900 antialiased pb-12">

    <!-- Global Header -->
    <header class="sticky top-0 z-50 px-6 py-4 bg-slate-950/80 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="h-10 w-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/30">
                    E
                </div>
                <div>
                    <h1 class="text-white font-bold text-lg leading-tight">Audit Command</h1>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-widest">Global Security Log</p>
                </div>
            </div>

            <!-- Double Clock System -->
            <div class="flex items-center gap-3">
                <div class="flex flex-col items-end px-4 border-r border-white/10">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Local (IST)</span>
                    <span id="istClock" class="text-white mono-time font-medium text-sm">--:--:--</span>
                </div>
                <div class="flex flex-col items-end pr-4">
                    <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-tighter flex items-center gap-1">
                        <span class="w-1 h-1 bg-indigo-400 rounded-full live-indicator"></span> Global (ITC/UTC)
                    </span>
                    <span id="utcClock" class="text-indigo-100 mono-time font-medium text-sm">--:--:--</span>
                </div>
                
                <div class="flex items-center gap-2 ml-4">
                    <button id="refreshBtn" onclick="handleRefresh()" class="p-2.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-white transition-all group">
                        <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                    <a href="/super-admin/dashboard" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold transition-all shadow-lg shadow-indigo-600/20">
                        Exit
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto mt-8 px-6">
        
        <!-- Filter Bar -->
        <div class="glass-panel rounded-2xl p-4 mb-6 flex flex-wrap items-center gap-4">
            <div class="flex-1 min-w-[300px] relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <select id="actionFilter" onchange="loadLogs()" class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition-all appearance-none cursor-pointer">
                    <option value="">All Global Activity</option>
                    <optgroup label="Events Management">
                        <option value="event_created">Event Created</option>
                        <option value="event_updated">Event Updated</option>
                        <option value="event_deleted">Event Deleted</option>
                        <option value="event_activated">Event Activated</option>
                    </optgroup>
                    <optgroup label="Access Control">
                        <option value="admin_created">New Admin Created</option>
                        <option value="admin_removed">Admin Removed</option>
                        <option value="bouncer_created">Bouncer Onboarded</option>
                    </optgroup>
                </select>
            </div>

            <div class="relative min-w-[180px]">
                <input type="date" id="dateFilter" onchange="loadLogs()" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>

            <div class="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-xl border border-slate-200">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Real-time Feed</span>
                <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] live-indicator"></div>
            </div>
        </div>

        <!-- Table Card -->
        <div class="glass-panel rounded-3xl overflow-hidden border border-white/40">
            <div class="overflow-x-auto">
                <table class="w-full text-left elite-table border-collapse">
                    <thead class="bg-slate-50/50">
                        <tr>
                            <th class="px-6 py-4">Timestamp (IST)</th>
                            <th class="px-6 py-4">Security Action</th>
                            <th class="px-6 py-4">Performer</th>
                            <th class="px-6 py-4">Activity Metadata</th>
                            <th class="px-6 py-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logsContainer">
                        <!-- Content loaded by JS -->
                        <tr>
                            <td colspan="5" class="py-20 text-center">
                                <div class="flex flex-col items-center gap-3">
                                    <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full refresh-spin"></div>
                                    <p class="text-slate-500 font-medium text-sm">Synchronizing logs...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Overlay Info Box (Custom Alert replacement) -->
    <div id="toast" class="fixed bottom-8 right-8 translate-y-20 opacity-0 transition-all duration-300 z-[100]">
        <div class="bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
            <span id="toastIcon"></span>
            <span id="toastMsg" class="text-sm font-bold"></span>
        </div>
    </div>

    <script>
        // Elite Dual Clock System
        function updateClocks() {
            const now = new Date();
            
            // IST (Local)
            const istOptions = { 
                timeZone: 'Asia/Kolkata', 
                hour: '2-digit', minute: '2-digit', second: '2-digit', 
                hour12: true 
            };
            document.getElementById('istClock').textContent = now.toLocaleTimeString('en-IN', istOptions);

            // UTC (ITC) - Calculated as IST minus 5:30
            // Since standard Date.toISOString() or UTC methods provide this, we use the UTC timezone
            const utcOptions = { 
                timeZone: 'UTC', 
                hour: '2-digit', minute: '2-digit', second: '2-digit', 
                hour12: false 
            };
            document.getElementById('utcClock').textContent = now.toLocaleTimeString('en-GB', utcOptions);
        }

        setInterval(updateClocks, 1000);
        updateClocks();

        // Helper: Format Timestamp for Table
        function formatLogTime(ts) {
            let date;
            if (ts && ts.$date) {
                date = new Date(ts.$date.$numberLong ? parseInt(ts.$date.$numberLong) : ts.$date);
            } else {
                date = new Date(ts || Date.now());
            }

            // Convert to IST
            const IST_OFFSET = (5 * 60 + 30) * 60 * 1000;
            const istDate = new Date(date.getTime() + IST_OFFSET);

            return {
                day: istDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
                time: istDate.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })
            };
        }

        function getActionConfig(type) {
            const configs = {
                event_created: { color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100', dot: 'bg-emerald-500' },
                event_deleted: { color: 'text-rose-600', bg: 'bg-rose-50', border: 'border-rose-100', dot: 'bg-rose-500' },
                admin_created: { color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-100', dot: 'bg-blue-500' },
                global_event_control: { color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-100', dot: 'bg-amber-500' }
            };
            return configs[type] || { color: 'text-slate-600', bg: 'bg-slate-50', border: 'border-slate-100', dot: 'bg-slate-400' };
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        async function handleRefresh() {
            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');
            
            icon.classList.add('refresh-spin');
            btn.disabled = true;
            
            await loadLogs();
            
            setTimeout(() => {
                icon.classList.remove('refresh-spin');
                btn.disabled = false;
                showToast('Logs synchronized successfully');
            }, 600);
        }

        async function loadLogs() {
            const container = document.getElementById('logsContainer');
            const actionType = document.getElementById('actionFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;

            let url = '/super-admin/api/audit-logs';
            const params = new URLSearchParams();
            if (actionType) params.append('action_type', actionType);
            if (dateFilter) params.append('date', dateFilter);
            if (params.toString()) url += '?' + params.toString();

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.success && data.logs?.length > 0) {
                    container.innerHTML = data.logs.map(log => {
                        const timeInfo = formatLogTime(log.timestamp);
                        const cfg = getActionConfig(log.action_type);
                        const performer = log.performed_by_name || 'System Auto';
                        const initial = performer.split(' ').map(n => n[0]).join('').substring(0, 2);

                        return `
                            <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-100 group">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex flex-col">
                                        <span class="text-sm font-bold text-slate-900 tracking-tight">${timeInfo.day}</span>
                                        <span class="text-xs font-medium text-slate-400 mono-time">${timeInfo.time}</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest border ${cfg.bg} ${cfg.color} ${cfg.border}">
                                        <span class="status-dot ${cfg.dot}"></span>
                                        ${(log.action_type || 'system_event').replace(/_/g, ' ')}
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-[10px] text-white font-black shadow-sm">
                                            ${initial}
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-sm font-bold text-slate-800">${performer}</span>
                                            <span class="text-[10px] text-slate-400 font-medium">${log.performed_by_email || 'automated@system'}</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <p class="text-sm text-slate-500 line-clamp-1 group-hover:line-clamp-none transition-all duration-300 max-w-md font-medium italic">
                                        "${log.details || 'No extended metadata available'}"
                                    </p>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded shadow-sm">VERIFIED</span>
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = `
                        <tr>
                            <td colspan="5" class="py-32 text-center">
                                <div class="opacity-20 text-6xl mb-4">🛡️</div>
                                <h3 class="text-slate-400 font-bold text-lg uppercase tracking-widest">Clear Perimeter</h3>
                                <p class="text-slate-400 text-sm">No security logs recorded for these parameters.</p>
                            </td>
                        </tr>
                    `;
                }
            } catch (err) {
                container.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-20 text-center">
                            <div class="bg-rose-50 text-rose-600 p-6 rounded-2xl inline-block border border-rose-100 shadow-xl">
                                <p class="font-bold mb-3">Satellite Uplink Failed</p>
                                <button onclick="loadLogs()" class="px-6 py-2 bg-rose-600 text-white rounded-lg text-sm font-bold hover:bg-rose-700 transition-all">Reconnect to Command</button>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadLogs);
    </script>
</body>
</html>
