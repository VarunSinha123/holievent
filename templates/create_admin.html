<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Admin | Create Administrator</title>
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
            background: #fdfdff;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: white;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:disabled {
            background: var(--secondary);
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: var(--primary);
        }

        /* Alerts */
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            border: 1px solid transparent;
        }

        .alert-success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border-color: #bbf7d0;
        }

        .alert-error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        ::placeholder {
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h1>👑 Create Admin</h1>
            <p>Onboard a new system administrator</p>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <form id="createAdminForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="name" required placeholder="e.g. Alex Johnson">
            </div>
            
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" required placeholder="admin@elitepass.com">
            </div>
            
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="password" required placeholder="••••••">
                </div>
                
                <div class="form-group">
                    <label>Confirm *</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••">
                </div>
            </div>
            
            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Create Administrator</span>
            </button>
        </form>
        
        <a href="/super-admin/dashboard" class="btn-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to Dashboard
        </a>
    </div>

    <script>
        document.getElementById('createAdminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alert = document.getElementById('alert');
            const submitBtn = document.getElementById('submitBtn');
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (password !== confirmPassword) {
                alert.className = 'alert alert-error';
                alert.innerHTML = '❌ <strong>Match Error:</strong> Passwords do not match!';
                return;
            }
            
            if (password.length < 6) {
                alert.className = 'alert alert-error';
                alert.innerHTML = '❌ <strong>Security:</strong> Password must be at least 6 characters!';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Creating Account...</span>';
            
            try {
                const response = await fetch('/super-admin/api/admins/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert.className = 'alert alert-success';
                    alert.innerHTML = '✅ <strong>Success!</strong> Administrator account created.';
                    document.getElementById('createAdminForm').reset();
                    
                    setTimeout(() => {
                        window.location.href = '/super-admin/admins';
                    }, 1500);
                } else {
                    alert.className = 'alert alert-error';
                    alert.innerHTML = '❌ <strong>Failed:</strong> ' + (data.message || 'Verification error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Create Administrator</span>';
                }
            } catch (error) {
                alert.className = 'alert alert-error';
                alert.innerHTML = '❌ <strong>System Error:</strong> Connection failed.';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Create Administrator</span>';
            }
        });
    </script>
</body>
</html>
