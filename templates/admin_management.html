<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Admin | Admin Management</title>
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 2rem;
        }

        .navbar-content {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            letter-spacing: -0.025em;
            text-decoration: none;
        }

        /* Container */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn-secondary { background: white; color: var(--text-main); border-color: var(--border); }
        .btn-secondary:hover { background: #f1f5f9; }
        .btn-danger { background: #fee2e2; color: #991b1b; }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }

        /* Card & Tables */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-header h2 { font-size: 1.25rem; font-weight: 700; }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 350px;
        }

        .search-box {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .table-container { width: 100%; overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; text-align: left; }

        th {
            background: #f8fafc;
            padding: 14px 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td { padding: 1.25rem 2rem; font-size: 0.875rem; border-bottom: 1px solid var(--border); vertical-align: middle; }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }

        /* Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-danger { background: #fee2e2; color: #991b1b; }

        .loading-state {
            padding: 4rem;
            text-align: center;
            color: var(--text-muted);
        }

        /* Custom Notification */
        #notificationContainer {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .notification {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div id="notificationContainer"></div>

    <nav class="navbar">
        <div class="navbar-content">
            <a href="#" class="brand">
                <span style="font-size: 1.5rem;">👑</span>
                <span>ELITE ADMIN</span>
            </a>
            <div>
                <span id="pageTitle" style="font-weight: 600; color: var(--text-muted); font-size: 0.9rem;">Admin Management</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header-actions">
            <a href="/super-admin/dashboard" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Back to Dashboard
            </a>
            <a href="/super-admin/create-admin" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7v14"/></svg>
                Create New Admin
            </a>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Admin Users</h2>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-box" id="searchBox" placeholder="Search by name or email..." onkeyup="filterTable()">
                </div>
            </div>
            
            <div class="table-container" id="tableContainer">
                <div class="loading-state">
                    <p>Loading administrators...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 id="confirmTitle" style="margin-bottom: 0.75rem; font-weight: 700; font-size: 1.25rem;">Confirm Action</h3>
            <p id="confirmMessage" style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">Are you sure you want to proceed?</p>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="resolveConfirmAction(false)">Cancel</button>
                <button class="btn btn-primary" id="confirmActionBtn" onclick="resolveConfirmAction(true)">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        let adminsData = [];
        let resolveConfirm;

        /** UI Helpers **/
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const note = document.createElement('div');
            note.className = 'notification';
            
            const colorMap = {
                'success': '#10b981',
                'danger': '#ef4444',
                'info': '#6366f1'
            };
            note.style.borderLeftColor = colorMap[type] || colorMap.info;
            
            const icon = type === 'success' ? '✅' : type === 'danger' ? '❌' : 'ℹ️';
            note.innerHTML = `<span>${icon}</span><span style="font-weight: 500; font-size: 0.9rem;">${message}</span>`;
            
            container.appendChild(note);
            setTimeout(() => {
                note.style.opacity = '0';
                note.style.transform = 'translateX(20px)';
                note.style.transition = 'all 0.3s ease';
                setTimeout(() => note.remove(), 300);
            }, 4000);
        }

        function customConfirm(title, message, isDanger = false) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            const btn = document.getElementById('confirmActionBtn');
            btn.className = isDanger ? 'btn btn-primary' : 'btn btn-primary';
            btn.style.backgroundColor = isDanger ? 'var(--danger)' : 'var(--primary)';
            
            document.getElementById('confirmModal').classList.add('active');
            
            return new Promise((resolve) => {
                resolveConfirm = resolve;
            });
        }

        function resolveConfirmAction(value) {
            document.getElementById('confirmModal').classList.remove('active');
            if (resolveConfirm) {
                resolveConfirm(value);
                resolveConfirm = null;
            }
        }

        /** Data Logic **/
        async function loadAdmins() {
            try {
                const response = await fetch('/super-admin/api/admins');
                const data = await response.json();

                if (data.success) {
                    adminsData = data.admins;
                    displayAdmins(adminsData);
                } else {
                    document.getElementById('tableContainer').innerHTML = `
                        <div class="loading-state">
                            <p style="color: var(--danger)">Failed to load admin data.</p>
                        </div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tableContainer').innerHTML = `
                    <div class="loading-state">
                        <p style="color: var(--danger)">Error connecting to server.</p>
                    </div>`;
            }
        }

        function displayAdmins(admins) {
            const tableContainer = document.getElementById('tableContainer');
            
            if (!admins || admins.length === 0) {
                tableContainer.innerHTML = '<div class="loading-state"><p>No administrators found.</p></div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Administrator</th>
                            <th>Contact Info</th>
                            <th>Events</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            admins.forEach(admin => {
                const createdAt = new Date(admin.created_at?.$date || admin.created_at).toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric'
                });
                const isActive = admin.is_active !== false;
                const adminId = admin._id?.$oid || admin._id;

                html += `
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div style="width: 36px; height: 36px; border-radius: 10px; background: #e0e7ff; color: #4338ca; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;">
                                    ${(admin.name || 'A').charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div style="font-weight: 700; color: var(--text-main);">${admin.name || 'N/A'}</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">Admin Account</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div style="font-weight: 500;">${admin.email || 'N/A'}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${admin.phone || ''}</div>
                        </td>
                        <td>
                            <div style="font-weight: 600;">${admin.events_created || 0}</div>
                        </td>
                        <td>
                            <span class="badge ${isActive ? 'badge-success' : 'badge-danger'}">
                                ${isActive ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td style="color: var(--text-muted); font-size: 0.8rem;">
                            ${createdAt}
                        </td>
                        <td style="text-align: right;">
                            <button class="btn btn-sm btn-danger" onclick="removeAdmin('${adminId}', '${admin.name}')">
                                Remove
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            tableContainer.innerHTML = html;
        }

        async function removeAdmin(adminId, adminName) {
            const confirmed = await customConfirm(
                "Remove Administrator", 
                `Are you sure you want to remove "${adminName}"? Their privileges will be revoked immediately.`,
                true
            );
            
            if (!confirmed) return;

            try {
                const response = await fetch(`/super-admin/api/admins/${adminId}/remove`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('Administrator removed successfully', 'success');
                    loadAdmins();
                } else {
                    showNotification(data.message || 'Failed to remove admin', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error removing administrator', 'danger');
            }
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filtered = adminsData.filter(admin => 
                (admin.name || '').toLowerCase().includes(searchTerm) ||
                (admin.email || '').toLowerCase().includes(searchTerm)
            );
            displayAdmins(filtered);
        }

        // Initialize on load
        window.onload = loadAdmins;
    </script>
</body>
</html>
